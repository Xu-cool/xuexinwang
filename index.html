<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>高等教育信息</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #f3f3f3; }
      body { display: flex; justify-content: center; font-family: Arial, "Microsoft YaHei", sans-serif; }
      .page { position: relative; width: 100%; max-width: 430px; background: #fff; line-height: 0; }
      .page-image { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
      .student-record-link {
        position: absolute;
        top: 24.08%;
        left: 4.24%;
        width: 91.53%;
        height: 11.86%;
        border-radius: 2%;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .student-record-link:focus-visible { outline: 3px solid #1677ff; outline-offset: -3px; }
    </style>
  </head>
  <body>
    <main class="page">
      <img class="page-image" src="1.jpg" alt="高等教育信息页面">
      <a class="student-record-link" href="detail.html" aria-label="查看学籍信息"></a>
    </main>
  </body>
</html>
